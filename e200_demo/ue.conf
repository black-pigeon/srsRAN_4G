[rf]
freq_offset = 0
# Match the measured downlink setting; AD9361 attenuation is 10 dB.
tx_gain = 79
rx_gain = 40
nof_antennas = 1
device_name = UHD
device_args = addr=192.168.10.2,recv_frame_size=1472,send_frame_size=1472,ignore_tx_timestamps=false,clock=external,clock_source=external
# With 66 samples, the eNB consistently decoded PRACH preamble N as N-1.
# ZCZC=5 gives Ncs=26, i.e. 24.79 us at the 1.25 kHz PRACH spacing;
# adding that interval plus the measured 1 us residual is 149 samples at
# 5.76 MSps, so the calibrated strict-timestamp advance is 66+149=215.
time_adv_nsamples = 215
continuous_tx = yes

[phy]
[rat.eutra]
dl_earfcn = 3350
nof_carriers = 1

[rat.nr]
nof_carriers = 0

[pcap]
enable = none
mac_filename = /tmp/e200_ue_mac.pcap
nas_filename = /tmp/e200_ue_nas.pcap

[log]
all_level = info
phy_lib_level = warning
all_hex_limit = 32
filename = /tmp/e200_ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc = 63BFA50EE6523365FF14C1F45F88737D
k = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[nas]
apn = srsapn
apn_protocol = ipv4
force_imsi_attach = true

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
