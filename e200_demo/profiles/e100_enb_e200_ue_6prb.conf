# LTE 1.4 MHz / 1.92 MSps mixed-device validation profile.
# eNB: E100 on 192.168.1.10; UE: E200 on 192.168.10.122.
# The E100 RX pipeline needs 49 samples of eNB-side compensation.  E200 uplink
# uses full TX gain and a fixed amplitude so PUSCH remains decodable by E100.
E200_N_PRB=6
E200_TIME_ADV_NSAMPLES=215
E200_CLOCK_SOURCE=internal
E200_UE_NETNS=ue1
E200_SIB_CONFIG=profiles/sib_6prb.conf
E200_ENB_ADDR=192.168.1.10
E200_UE_ADDR=192.168.10.122
E200_ENB_SAMPLE_RATE=1920000
E200_UE_SAMPLE_RATE=1920000
E200_ENB_TIME_ADV_NSAMPLES=49
E200_ENB_RX_GAIN=40
E200_UE_TX_GAIN=89
E200_UE_FORCE_UL_AMPLITUDE=0.5
