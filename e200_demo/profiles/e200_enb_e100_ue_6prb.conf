# LTE 1.4 MHz / 1.92 MSps mixed-device role-reversal profile.
# eNB: E200 on 192.168.10.122; UE: E100 on 192.168.1.10.
# E100's TX pipeline needs 49 more advance samples than the E200 UE baseline.
E200_N_PRB=6
E200_TIME_ADV_NSAMPLES=264
E200_CLOCK_SOURCE=internal
E200_UE_NETNS=ue1
E200_SIB_CONFIG=profiles/sib_6prb.conf
E200_ENB_ADDR=192.168.10.122
E200_UE_ADDR=192.168.1.10
E200_ENB_SAMPLE_RATE=1920000
E200_UE_SAMPLE_RATE=1920000
E200_ENB_TIME_ADV_NSAMPLES=0
E200_ENB_RX_GAIN=40
E200_UE_TX_GAIN=50
