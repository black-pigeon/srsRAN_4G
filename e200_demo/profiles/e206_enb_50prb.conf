# E206 eNB at the native LTE 10 MHz rate.  The E200 UE uses the verified
# 23.04 MSPS path as a 2x receive/transmit rate.
# A 0.5 digital peak avoids the wide-PUSCH compression seen with auto scaling.
E200_N_PRB=50
E200_ENB_SAMPLE_RATE=11520000
E200_UE_SAMPLE_RATE=23040000
E200_ENB_TIME_ADV_NSAMPLES=0
E200_TIME_ADV_NSAMPLES=215
E200_ENB_RX_GAIN=40
E200_UE_TX_GAIN=89
E200_UE_FORCE_UL_AMPLITUDE=0.5
E200_CLOCK_SOURCE=external
E200_ENB_ADDR=192.168.1.10
E200_UE_ADDR=192.168.10.122
E200_UE_NETNS=ue1
