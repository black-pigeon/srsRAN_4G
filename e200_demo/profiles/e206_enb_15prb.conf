# E206 eNB at the native LTE 3 MHz rate.  The E200 UE uses a 2x rate because
# its 3.84 MSPS receive path could not acquire the otherwise-valid downlink.
# Keep the E200 UE at zero RF attenuation, but reduce its digital peak.  The
# former auto-scaled waveform gave poor wide-PUSCH linearity at the E206 eNB.
E200_N_PRB=15
E200_ENB_SAMPLE_RATE=3840000
E200_UE_SAMPLE_RATE=7680000
E200_ENB_TIME_ADV_NSAMPLES=0
E200_TIME_ADV_NSAMPLES=287
E200_ENB_RX_GAIN=40
E200_UE_TX_GAIN=89
E200_UE_FORCE_UL_AMPLITUDE=0.5
E200_CLOCK_SOURCE=external
E200_ENB_ADDR=192.168.1.10
E200_UE_ADDR=192.168.10.122
E200_UE_NETNS=ue1
