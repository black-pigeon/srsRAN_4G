[enb]
enb_id = 0x19B
mcc = 001
mnc = 01
mme_addr = 127.0.1.100
gtp_bind_addr = 127.0.1.1
s1c_bind_addr = 127.0.1.1
s1c_bind_port = 0
n_prb = 75
tm = 1
nof_ports = 1

[enb_files]
sib_config = ../srsenb/sib.conf.example
rr_config = ../srsenb/rr.conf.example
rb_config = ../srsenb/rb.conf.example

[rf]
dl_earfcn = 3350
# E200 maps UHD gain to AD9361 attenuation as 89 - gain (0 dB here).
tx_gain = 89
rx_gain = 40
device_name = UHD
device_args = addr=192.168.1.10,recv_frame_size=1472,send_frame_size=1472,ignore_tx_timestamps=false,clock=external,clock_source=external
# Strict timed TX is handled by the FPGA burst scheduler. Keep the application
# timing advance at the standard LTE value; do not compensate it here.
time_adv_nsamples = 0

[pcap]
enable = false
filename = /tmp/e200_enb_mac.pcap
s1ap_enable = false
s1ap_filename = /tmp/e200_enb_s1ap.pcap

[log]
all_level = info
all_hex_limit = 32
filename = /tmp/e200_enb.log
file_max_size = -1

[gui]
enable = false
