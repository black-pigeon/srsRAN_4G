[rf]
freq_offset = 0
tx_gain = 70
rx_gain = 40
nof_antennas = 1
device_name = UHD
device_args = type=ant,addr=192.168.10.122,product=E310v2,recv_frame_size=1472,recv_buff_size=33554432,rx_subdev_spec=A:A,tx_subdev_spec=A:A,send_frame_size=1472,send_buff_size=33554432,num_recv_frames=2048,num_send_frames=2048,ignore_tx_timestamps=false,master_clock_rate=23.04e6,sampling_rate=5.76e6
time_adv_nsamples = 100
continuous_tx = yes

[phy]

[rat.eutra]
dl_earfcn = 2900
nof_carriers = 1

[rat.nr]
nof_carriers = 0

[pcap]
enable = none
mac_filename = /tmp/antsdr_ue_mac.pcap
nas_filename = /tmp/antsdr_ue_nas.pcap

[log]
all_level = info
phy_lib_level = warning
all_hex_limit = 32
filename = /home/wcc/mp_demo/SDR-APP/srsRAN_4G/antsdr_demo/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc = 63BFA50EE6523365FFCF1F45F88737D0
k = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[nas]
apn = srsapn
apn_protocol = ipv4
force_imsi_attach = true

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
